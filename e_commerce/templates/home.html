<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

/* Navbar */
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  background-color: #333333;
  display: flex;
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
  z-index: 1000;
}

ul li a {
  display: block;
  color: white;
  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover:not(.active) {
  background-color: #111111;
}

ul li a.active {
  background-color: #04AA6D;
}

/* Hero Section */
.hero-image {
  background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  height: 100vh;
  position: relative;
  color: white;
}

.hero-text {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
}

.hero-text h1 {
  font-size: 50px;
}

.hero-text p {
  font-size: 20px;
  margin-bottom: 20px;
}

.hero-text button {
  border: none;
  outline: 0;
  display: inline-block;
  padding: 10px 25px;
  color: black;
  background-color: #ddd;
  text-align: center;
  cursor: pointer;
  border-radius: 8px;
}

.hero-text button:hover {
  background-color: #555;
  color: white;
}
.list_product a {
  text-decoration: none;
  color: white;
  background-color: #131313;
  padding: 10px 20px;
  border-radius: 5px;
}
</style>
</head>
<body>

<ul>
  <li><a class="active" href="{% url 'home'%}">Home</a></li>
  <li><a href="{% url 'add_product'%}">Products</a></li>
  <li><a href="{% url 'list_products'%}">List Products</a></li>
</ul>

<div class="hero-image">
  <div class="hero-text">
    <h1>Welcome to Product Store</h1>
    <p>Manage and explore your products easily</p>
    <li class="list_product"><a href="{% url 'list_products'%}">View Products</a></li>
  </div>
</div>

<p style="text-align:center; margin: 30px;">Page Content...</p>

</body>
</html>
