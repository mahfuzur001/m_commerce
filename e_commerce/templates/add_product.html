<!DOCTYPE html>
<html>
<style>
form {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

label {display: block;}

input[type=text], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}
body {
  margin: 0;
  padding: 0;
}

h2, p {
  margin: 10px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  background-color: #333333;
  display: flex;
}

ul li a {
  display: block;
  color: white;
  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover:not(.active) {
  background-color: #111111;
}

ul li a.active {
  background-color: #04AA6D;
}
</style>
<body>

<ul>
  <li><a class="active" href="{% url 'home'%}">Home</a></li>
  <li><a href="{% url 'add_product'%}">Products</a></li>
    <li><a href="{% url 'list_products'%}">List Products</a></li>
  
</ul>

<h1>Product Form</h1>

<form action="{% url 'add_product' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <label for="fname">Product Name</label>
  <input type="text" id="fname" name="Product_Name" placeholder="Product Name">

  <label for="fname">Product Image</label>
  <input type="file" id="fname" name="Product_image" placeholder="Product Image">

  <label for="lname">Product Description</label>
  <input type="text" id="lname" name="Product_Description" placeholder="Product Description">

   <label for="lname">Product price</label>
  <input type="text" id="lname" name="Product_price" placeholder="Product price..">

   <label for="lname">Product stock</label>
  <input type="text" id="lname" name="Product_stock" placeholder="Product stock..">

  

  <input type="submit" value="Submit">
</form>

</body>
</html>
